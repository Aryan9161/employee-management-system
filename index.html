<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee Manager</title>
<style>
  :root {
    --bg: #eef2f1;
    --surface: #ffffff;
    --ink: #1c2b2a;
    --muted: #5d6f6d;
    --line: #d5dedc;
    --brand: #0f6b5c;
    --brand-dark: #0a4f44;
    --danger: #b3382c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }
  .hidden { display: none !important; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid #7cc4b6; outline-offset: 2px; }

  /* Login */
  #loginPage { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; }
  .login-box {
    background: var(--surface); width: 100%; max-width: 360px;
    padding: 32px 28px; border-radius: 10px; border: 1px solid var(--line);
  }
  .login-box h1 { font-size: 24px; margin-bottom: 4px; }
  .login-box p { color: var(--muted); margin-bottom: 22px; font-size: 14px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 14px 0 6px; }
  input {
    width: 100%; padding: 10px 12px; font: inherit;
    border: 1px solid var(--line); border-radius: 6px; background: #fff;
  }
  .btn {
    border: none; border-radius: 6px; padding: 10px 18px; font-weight: 600;
    background: var(--brand); color: #fff;
  }
  .btn:hover { background: var(--brand-dark); }
  .btn.full { width: 100%; margin-top: 22px; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn.ghost:hover { background: var(--bg); }
  .error { color: var(--danger); font-size: 14px; margin-top: 12px; min-height: 18px; }

  /* App */
  header {
    background: var(--brand); color: #fff; padding: 14px 24px;
    display: flex; justify-content: space-between; align-items: center;
  }
  header h2 { font-size: 20px; }
  header .btn { background: rgba(255,255,255,.15); }
  header .btn:hover { background: rgba(255,255,255,.28); }
  main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .bar h3 { font-size: 18px; }
  .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 560px; }
  th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  th { font-size: 14px; color: var(--muted); font-weight: 600; background: #f6f9f8; }
  tr:last-child td { border-bottom: none; }
  .icon-btn {
    background: none; border: none; font-size: 18px; padding: 6px 8px; border-radius: 6px;
  }
  .icon-btn:hover { background: var(--bg); }
  .empty { padding: 28px; text-align: center; color: var(--muted); }

  /* Modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.4);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .modal { background: var(--surface); width: 100%; max-width: 400px; padding: 26px; border-radius: 10px; }
  .modal h3 { margin-bottom: 4px; }
  .modal .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
</style>
</head>
<body>

<!-- LOGIN PAGE -->
<section id="loginPage">
  <form class="login-box" id="loginForm">
    <h1>Sign in</h1>
    <p>Employee Manager me login karein</p>
    <label for="userid">User ID</label>
    <input id="userid" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <div class="error" id="loginError"></div>
    <button class="btn full" type="submit">Login</button>
  </form>
</section>

<!-- APP PAGE -->
<section id="appPage" class="hidden">
  <header>
    <h2>Employee Manager</h2>
    <button class="btn" id="logoutBtn">Logout</button>
  </header>
  <main>
    <div class="bar">
      <h3>Employees</h3>
      <button class="btn" id="addBtn">+ Add employee</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>S.No</th><th>Name</th><th>Department</th><th>Salary</th><th>Actions</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>
</section>

<!-- ADD / EDIT MODAL -->
<div class="overlay hidden" id="modal">
  <form class="modal" id="empForm">
    <h3 id="modalTitle">Add employee</h3>
    <label for="empName">Name</label>
    <input id="empName" required>
    <label for="empDepartment">Department</label>
    <input id="empDepartment" required>
    <label for="empSalary">Salary (₹)</label>
    <input id="empSalary" type="number" min="0" required>
    <div class="actions">
      <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
      <button type="submit" class="btn" id="saveBtn">Save</button>
    </div>
  </form>
</div>

<script>
  // ---- Data (ab API se aayega) ----
  let employees = [];
  const API = "http://127.0.0.1:8000";

  async function loadEmployees() {
    const res = await fetch(API + "/employees");
    employees = await res.json();
    render();
  }
  let nextId = 6;
  let editingId = null; // null = add mode

  const $ = id => document.getElementById(id);

  // ---- Login ----
  $("loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    const u = $("userid").value.trim();
    const p = $("password").value;
    const res = await fetch(API + "/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: u, password: p })
    });
    if (res.ok) {
      $("loginError").textContent = "";
      $("loginPage").classList.add("hidden");
      $("appPage").classList.remove("hidden");
      loadEmployees();
    } else {
      $("loginError").textContent = "User ID ya password galat hai.";
    }
  });

  // ---- Render table ----
  function render() {
    const tbody = $("tbody");
    tbody.innerHTML = "";
    if (employees.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty">Koi employee nahi hai. "Add employee" dabayein.</td></tr>';
      return;
    }
    employees.forEach((emp, index) => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${index + 1}</td>
        <td></td>
        <td></td>
        <td>₹${Number(emp.salary).toLocaleString("en-IN")}</td>
        <td>
          <button class="icon-btn" title="Edit" aria-label="Edit">✏️</button>
          <button class="icon-btn" title="Delete" aria-label="Delete">🗑️</button>
        </td>`;
      // textContent use kiya taaki user input se HTML inject na ho
      tr.children[1].textContent = emp.name;
      tr.children[2].textContent = emp.dept;
      const [editBtn, delBtn] = tr.querySelectorAll("button");
      editBtn.addEventListener("click", () => openModal(emp.id));
      delBtn.addEventListener("click", () => deleteEmp(emp.id));
      tbody.appendChild(tr);
    });
  }

  // ---- Modal open/close ----
  function openModal(id = null) {
    editingId = id;
    if (id === null) {
      $("modalTitle").textContent = "Add employee";
      $("empForm").reset();
    } else {
      const emp = employees.find(x => x.id === id);
      $("modalTitle").textContent = "Edit employee";
      $("empName").value = emp.name;
      $("empDepartment").value = emp.dept;
      $("empSalary").value = emp.salary;
    }
    $("modal").classList.remove("hidden");
    $("empName").focus();
  }
  function closeModal() { $("modal").classList.add("hidden"); }

  $("addBtn").addEventListener("click", () => openModal());
  $("cancelBtn").addEventListener("click", closeModal);

  // ---- Save (add or edit) ----
    $("empForm").addEventListener("submit", async e => {
    e.preventDefault();
    const name = $("empName").value.trim();
    const dept = $("empDepartment").value.trim();
    const salary = Number($("empSalary").value);
    if (editingId === null) {
      await fetch(API + "/employees", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, dept, salary })
      });
    } else {
      await fetch(API + "/employees/" + editingId, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, dept, salary })
      });
    }
    closeModal();
    await loadEmployees();
  });

  // ---- Delete ----
  async function deleteEmp(id) {
  const emp = employees.find(x => x.id === id);
  if (confirm("Delete " + emp.name + "?")) {
    await fetch(API + "/employees/" + id, { method: "DELETE" });
    await loadEmployees();
  }
}
</script>
</body>
</html>
